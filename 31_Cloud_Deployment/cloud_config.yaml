# GCP Cloud Build Configuration (cloud_config.yaml)

steps:
  # 1. Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', '[LOCATION]-docker.pkg.dev/$PROJECT_ID/[REPOSITORY_NAME]/ml-app-service:$COMMIT_SHA', '.']

  # 2. Push image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '[LOCATION]-docker.pkg.dev/$PROJECT_ID/[REPOSITORY_NAME]/ml-app-service:$COMMIT_SHA']

  # 3. Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'ml-app-service'
      - '--image'
      - '[LOCATION]-docker.pkg.dev/$PROJECT_ID/[REPOSITORY_NAME]/ml-app-service:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--set-secrets'
      - 'DATABASE_URL=projects/$PROJECT_ID/secrets/database-url/versions/latest,API_KEY=projects/$PROJECT_ID/secrets/api-key/versions/latest'

images:
  - '[LOCATION]-docker.pkg.dev/$PROJECT_ID/[REPOSITORY_NAME]/ml-app-service:$COMMIT_SHA'